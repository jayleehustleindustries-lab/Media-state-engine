services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: media_state
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/media_state
      MEDIA_ENGINE_API_KEY: dev-key-change-me
      IMAGE_GATE_FAIL_CLOSED: "true"
      IMAGE_GATE_BREAK_GLASS: "false"
      IMAGE_GATE_MAX_ATTEMPTS: "3"
      ACTIVE_REFERENCE_SET_PATH: /app/reference_images/ACTIVE_REFERENCE_SET.json
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./reference_images:/app/reference_images:ro
  worker:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/media_state
      MEDIA_ENGINE_API_KEY: dev-key-change-me
      IMAGE_GATE_FAIL_CLOSED: "true"
      IMAGE_GATE_BREAK_GLASS: "false"
      ACTIVE_REFERENCE_SET_PATH: /app/reference_images/ACTIVE_REFERENCE_SET.json
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./reference_images:/app/reference_images:ro
